<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Список пользователей">
    <meta name="author" content="Ваше имя">
    <title>Список пользователей</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .bd-placeholder-img {
            font-size: 1.125rem;
            text-anchor: middle;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        @media (min-width: 768px) {
            .bd-placeholder-img-lg {
                font-size: 3.5rem;
            }
        }

        .card-img-top {
            width: 100%;
            height: 225px;
            object-fit: cover;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-avatar {
            width: 100%;
            height: 225px;
            background-color: #55595c;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }

        /* Убираем анимацию мерцания */
        .navbar-collapse {
            transition: none !important;
        }
    </style>
</head>
<body>

<header>
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a href="{% url 'mailing:mailing_main' %}" class="navbar-brand d-flex align-items-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true" class="me-2" viewBox="0 0 24 24">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
                <strong>Сервис рассылок</strong>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'users:list_user' %}">Список пользователей</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'users:create_user' %}">Создать пользователя</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'mailing:list_message' %}">Список сообщений</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'mailing:create_message' %}">Создать сообщение</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'mailing:list_mailing' %}">Список рассылок</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'mailing:create_mailing' %}">Создать рассылку</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

{% block content %}{% endblock %}

<footer class="text-muted py-5">
    <div class="container">
        <p class="float-end mb-1">
            <a href="#">Вернуться наверх</a>
        </p>
        <p class="mb-1">Система управления пользователями © {% now "Y" %}</p>
    </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script>
// Дополнительная инициализация для Bootstrap
document.addEventListener('DOMContentLoaded', function() {
    // Убеждаемся, что Bootstrap JS загружен
    if (typeof bootstrap !== 'undefined') {
        // Инициализируем все выпадающие меню
        var collapseElements = document.querySelectorAll('.collapse');
        collapseElements.forEach(function(element) {
            new bootstrap.Collapse(element, {
                toggle: false
            });
        });
    }

    // Предотвращаем закрытие меню при клике внутри
    var navLinks = document.querySelectorAll('.navbar-nav .nav-link');
    var navbarCollapse = document.querySelector('.navbar-collapse');

    navLinks.forEach(function(link) {
        link.addEventListener('click', function() {
            // Закрываем меню после клика на ссылку
            if (navbarCollapse.classList.contains('show')) {
                var bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
                if (bsCollapse) {
                    bsCollapse.hide();
                }
            }
        });
    });
});
</script>

</body>
</html>
