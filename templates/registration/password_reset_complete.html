{% extends 'base.html' %}

{% block content %}
<main>
    <section class="py-5 text-center container">
        <div class="row py-lg-5">
            <div class="col-lg-6 col-md-8 mx-auto">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <div class="mb-4">
                            <i class="bi bi-check-circle-fill display-1 text-success"></i>
                        </div>
                        <h1 class="h2 mb-3 fw-normal">Пароль успешно изменен</h1>
                        <p class="lead text-muted mb-4">
                            Ваш пароль был успешно изменен. Теперь вы можете войти в систему, используя новый пароль.
                        </p>
                        <div class="d-grid gap-2 col-sm-6 mx-auto">
                            <a href="{% url 'users:login' %}" class="btn btn-primary btn-lg px-5">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Войти в систему
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock %}
