{% extends 'base.html' %}

{% block content %}
<main>
    <section class="py-5 text-center container">
        <div class="row py-lg-5">
            <div class="col-lg-6 col-md-8 mx-auto">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <div class="mb-4">
                            <i class="bi bi-envelope-check-fill display-1 text-primary"></i>
                        </div>
                        <h1 class="h2 mb-3 fw-normal">Письмо отправлено</h1>
                        <p class="lead text-muted mb-4">
                            Мы отправили вам инструкцию по восстановлению пароля на указанный email адрес.
                            Если вы не получили письмо в течение нескольких минут, проверьте папку "Спам".
                        </p>
                        <div class="d-grid gap-2 col-sm-8 mx-auto">
                            <a href="{% url 'users:reset_password' %}" class="btn btn-outline-primary btn-lg">
                                <i class="bi bi-arrow-repeat me-2"></i>Отправить повторно
                            </a>
                            <a href="{% url 'mailing:mailing_main' %}" class="btn btn-link text-muted">
                                <i class="bi bi-house me-1"></i>Вернуться на главную
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock %}
